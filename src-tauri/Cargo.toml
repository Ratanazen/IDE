[package]
name = "ratana-flutter-studio"
version = "0.1.0"
description = "Ratana Flutter Studio Desktop Engine"
authors = ["Ratana Team"]
edition = "2021"

[lib]
name = "ratana_flutter_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["process", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
walkdir = "2"
dunce = "1"
which = "7"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
