[package]
name = "ridu-artifacts"
version = "0.1.0"
edition = "2021"
description = "Artifact discovery, verification, build history persistence, and IPA inspection for Ridu IDE"

[dependencies]
ridu-core = { path = "../ridu-core" }
ridu-security = { path = "../ridu-security" }
ridu-signing = { path = "../ridu-signing" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.10"
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
