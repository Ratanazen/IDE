[package]
name = "ridu-language"
version = "0.1.0"
edition = "2021"
description = "Language server adapters and compiler diagnostics parser for Ridu IDE"
authors = ["Ridu Team"]

[dependencies]
ridu-core = { path = "../ridu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
which = "7"
thiserror = "2"
