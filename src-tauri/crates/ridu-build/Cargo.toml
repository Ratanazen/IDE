[package]
name = "ridu-build"
version = "0.1.0"
edition = "2021"
description = "Build pipeline, process management, and build backends for Ridu IDE"

[dependencies]
ridu-core = { path = "../ridu-core" }
ridu-security = { path = "../ridu-security" }
ridu-project = { path = "../ridu-project" }
ridu-toolchain = { path = "../ridu-toolchain" }
ridu-artifacts = { path = "../ridu-artifacts" }
nix = { version = "0.29", features = ["process", "signal"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
walkdir = "2"
which = "7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
