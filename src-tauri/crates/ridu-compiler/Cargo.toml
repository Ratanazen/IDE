[package]
name = "ridu-compiler"
version = "0.1.0"
edition = "2021"
description = "Compiler discovery, command line builders, and toolchain adapters for Clang, Swiftc, and LLD"
authors = ["Ridu Team"]

[dependencies]
ridu-core = { path = "../ridu-core" }
ridu-language = { path = "../ridu-language" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
thiserror = "2"
