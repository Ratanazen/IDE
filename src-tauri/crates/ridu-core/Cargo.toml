[package]
name = "ridu-core"
version = "0.1.0"
edition = "2021"
description = "Core types, models, and error definitions for Ridu IDE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
