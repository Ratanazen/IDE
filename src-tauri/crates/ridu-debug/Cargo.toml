[package]
name = "ridu-debug"
version = "0.1.0"
edition = "2021"
description = "Debugger adapter interface, LLDB launch configurations, and device debugging session manager for Ridu IDE"
authors = ["Ridu Team"]

[dependencies]
ridu-core = { path = "../ridu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
